[package]
name = "lazy-recon"
version = "0.1.0"
edition = "2021"
default-run = "lazy-recon"
authors = ["Antigravity"]

[lib]
name = "lazy_recon"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.37", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls", "multipart"] }
hyper = { version = "0.14", features = ["full"] }
url = "2.3"
inquire = "0.6"
colored = "2.0"
indicatif = "0.17"
anyhow = "1.0"
once_cell = "1.19"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-rustls = "0.24"
webpki-roots = "0.25" # Added for TLS root certs
rand = "0.8"
jsonwebtoken = "9.2"
base64 = "0.21"
scraper = "0.26.0"
dashmap = "6.1.0"
futures-util = "0.3.32"
regex = "1.12.3"
